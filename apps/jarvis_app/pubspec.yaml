name: jarvis_app
description: Asistente personal JARVIS para Windows y Android.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  http: 1.6.0
  path_provider: 2.1.6
  record: 7.1.1
  audioplayers: 6.8.1
  window_manager: 0.5.2
  tray_manager: 0.3.2
  file_picker: 13.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/jarvis.ico
