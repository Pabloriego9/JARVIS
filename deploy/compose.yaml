services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      JARVIS_OPENAI_API_KEY: ${JARVIS_OPENAI_API_KEY:?Configurar en el servidor privado}
      JARVIS_MODEL: gpt-6-astra
      JARVIS_DATA_DIR: /data
    volumes:
      - jarvis_data:/data
    expose:
      - '8765'
  tls:
    image: caddy:2.10.2
    restart: unless-stopped
    environment:
      JARVIS_DOMAIN: ${JARVIS_DOMAIN:?Configurar dominio}
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend
volumes:
  jarvis_data:
  caddy_data:
